name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build :core:jmhJar
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/test-results/**'
  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:jmhJar
      - name: JMH smoke and allocation results
        run: java -jar core/build/libs/core-*-jmh.jar -wi 1 -i 2 -w 1s -r 1s -f 1 -prof gc -rf json -rff benchmark-results.json
      - uses: actions/upload-artifact@v6
        with:
          name: jmh-results
          path: benchmark-results.json
